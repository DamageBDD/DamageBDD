server {
    server_name *.damagebdd.com;
    server_tokens off;
    location / {
        add_header Cache-Control "no-cache";
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Credentials' 'true';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,X-Csrf-Token';
        root /srv/http/damagebdd/;
        index  index.html index.htm;
        try_files $uri $uri.html $uri/ =404;
    }
    location /git/{
        resolver 192.168.1.1 ipv6=off;
        proxy_pass http://threadripper0.lan:9002;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 300s;
    }
    location /metrics {
        stub_status on;
    }
    location /accounts/ {
        resolver 192.168.1.1 ipv6=off;
        proxy_pass http://node0:8080;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 300s;
    }
    location = /stub_status {
        stub_status;
    }
 	location /ipfs {
 		proxy_pass http://127.0.0.1:8082;
 		proxy_set_header Host damagebdd.com;
 	}
 
 	location /ipns {
 		proxy_pass http://127.0.0.1:8082;
 		proxy_set_header Host damagebdd.com;
 	}
    location /.well-known/lnurlp/ {
     resolver 192.168.1.1 ipv6=off;

        proxy_pass http://threadripper0.lan:8080;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/damagebdd.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/damagebdd.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = damagebdd.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name damagebdd.com;
    listen 80;
    return 404; # managed by Certbot


}

