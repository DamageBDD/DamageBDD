<!--Generate an html page that checks local cookie storage for a bitcoin payment address, if the payment address does not exist then the page makes a call to `/api/account_create` to get a new payment address, if the a payment address was found in local storage then call `/api/account_balance` to check that the account is valid and display the balance, also include a timer function that checks the balance every 5 seconds-->
<!DOCTYPE html>
<html>
<head>
  <title>Bitcoin Payment</title>
</head>
<body>
  <script>
    function getPaymentAddress() {
      var paymentAddress = localStorage.getItem('paymentAddress');
      if (!paymentAddress) {
        // If payment address does not exist in local storage, make API call to create a new one
        fetch('/api/account_create')
          .then(response => response.json())
          .then(data => {
            localStorage.setItem('paymentAddress', data.paymentAddress);
            checkAccountBalance(data.paymentAddress);
          })
          .catch(error => console.log(error));
      } else {
        // If payment address exists in local storage, check account balance
        checkAccountBalance(paymentAddress);
      }
    }

    function checkAccountBalance(paymentAddress) {
      fetch(`/api/account_balance?address=${paymentAddress}`)
        .then(response => response.json())
        .then(data => {
          // Display balance on the page
          document.getElementById('balance').innerHTML = `Account Balance: ${data.balance}`;
            document.getElementById('damage_rate').innerHTML = `Damage Balance: ${data.damage_rate}`;
            document.getElementById('damage_balance').innerHTML = `Damage Balance: ${data.damage_balance}`;
        })
        .catch(error => console.log(error));
    }

    function startTimer() {
      setInterval(() => {
        var paymentAddress = localStorage.getItem('paymentAddress');
        if (paymentAddress) {
          // Check account balance every 5 seconds
          checkAccountBalance(paymentAddress);
        }
      }, 5000);
    }

    function doRefund() {
      // Create an AJAX request
      $.ajax({
        type: 'POST',
        url: '/api/account_refund',
        contentType: 'application/json',
        data: JSON.stringify({'btc_address': 'btcaddress'}),
        success: function(response) {
          // Handle success response
          console.log('Request sent successfully');
          console.log('Response:', response);
        },
        error: function(xhr, status, error) {
          // Handle error response
          console.log('Request failed');
          console.log('Error:', error);
        }
      });
    }
    // Call the required functions on page load
    window.onload = function() {
      getPaymentAddress();
      startTimer();
    };
  </script>

  <h1>Bitcoin Payment</h1>
  <h2>Current Balance [Satoshis]</h2>
  <div id="balance"></div>
  <h2>Current Damage Rate (requests per Sat)</h2>
  <div id="damage_rate"></div>
  <h2>Current Damage Balance</h2>
  <div id="damage_balance"></div>
  <h2>Refund Damage Balance</h2>
  Refund the balance amount from the wallet (caution: this may take a whil depending on network state and fees)
  <button onclick="doRefund()">Refund.</button>
 
  <script>
  </script>
</body>
</html>
