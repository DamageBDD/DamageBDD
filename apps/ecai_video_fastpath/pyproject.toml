[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecai-video-fastpath"
version = "0.1.0"
description = "Bring-your-own-video-backend, verifiable asset reuse, and video NFT handoff"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "cryptography>=42,<50",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["ecai_video_fastpath*"]

[tool.setuptools.package-data]
ecai_video_fastpath = ["studio.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
