version: "3.9"

services:
  ae_mdw:
    image: aeternity/ae_mdw:latest
    container_name: ae_mdw
    restart: unless-stopped

    ports:
      - "4000:4000"   # MDW HTTP
      - "4002:4001"   # MDW WS
      - "3113:3113"   # node internal API
      - "3013:3013"   # node external API
      - "3014:3014"   # channels WS

    volumes:
      # ✅ persistent data (named volumes)
      - aeternity_mnesia:/home/aeternity/node/local/rel/aeternity/data/mnesia
      - aeternity_mdwdb:/home/aeternity/node/local/rel/aeternity/data/mdw.db

      # ✅ config stays a bind mount (read-only)
      - ${PWD}/docker/aeternity.yaml:/home/aeternity/aeternity.yaml:ro

    environment:
      AETERNITY_CONFIG: /home/aeternity/aeternity.yaml
      DISABLE_IPV6: "true"

volumes:
  aeternity_mnesia:
    name: aeternity_mnesia
  aeternity_mdwdb:
    name: aeternity_mdwdb
