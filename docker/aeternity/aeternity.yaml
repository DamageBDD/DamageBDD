sync:
    port: 3015
    log_peer_connection_count_interval: 6000000

http:
    external:
        port: 3013
    internal:
        port: 3113
    endpoints:
        dry-run: true

websocket:
    channel:
        port: 3014

chain:
    persist: true
    # strongly recommended: explicit persistent DB path
    db_path: /home/aeternity/node/data/mnesia
    garbage_collection:
        enabled: false

fork_management:
    network_id: ae_mainnet

logging:
    level: warning
