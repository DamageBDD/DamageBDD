name: iOS Build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build DamageBDD
        run: |
          xcodebuild \
            -project DamageMobile.xcodeproj \
            -scheme DamageBDD \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build ECAI
        run: |
          xcodebuild \
            -project DamageMobile.xcodeproj \
            -scheme ECAI \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
