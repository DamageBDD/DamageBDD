name: Android CI

on:
  push:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: damage
            display_name: DamageBDD
            artifact_name: damagebdd-debug
          - app: ecai
            display_name: ECAI
            artifact_name: ecai-debug

    defaults:
      run:
        shell: bash
        working-directory: mobile/android/${{ matrix.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/android/${{ matrix.app }}/package-lock.json

      - name: Install Android SDK packages
        working-directory: ${{ github.workspace }}
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets
        run: npm run web

      - name: Sync Capacitor Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
          fi

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: mobile/android/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-reports-${{ github.sha }}
          path: |
            mobile/android/${{ matrix.app }}/android/app/build/reports/**
            mobile/android/${{ matrix.app }}/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
